<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Watch</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <div class="app-shell">

        <!-- Header -->
        <header class="topbar">
            <div>
                <div class="brand">
                    <span class="brand-mark">M</span>
                    <span>Market Watch</span>
                </div>

                <p class="subtitle">
                    Track the stocks that matter to you.
                </p>
            </div>

            <div class="connection-status">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text">Connecting</span>
            </div>
        </header>


        <!-- Main -->
        <main>

            <!-- Add Stock -->
            <section class="add-section">

                <div class="section-label">
                    Add to watchlist
                </div>

                <form id="watchlist-form" class="add-form">

                    <div class="input-wrapper">
                        <input
                            id="symbol-input"
                            name="symbol"
                            type="text"
                            placeholder="Enter ticker symbol"
                            autocomplete="off"
                            maxlength="10"
                            required
                        />
                    </div>

                    <button
                        id="add-button"
                        type="submit"
                        class="primary-button"
                    >
                        <span class="button-icon">+</span>
                        Add
                    </button>

                </form>

                <div id="message" class="message hidden"></div>

            </section>


            <!-- Watchlist -->
            <section class="watchlist-section">

                <div class="section-header">
                    <div>
                        <div class="section-label">Your Watchlist</div>
                        <div id="watchlist-count" class="watchlist-count">
                            0 stocks
                        </div>
                    </div>

                    <button
                        id="refresh-button"
                        class="refresh-button"
                        type="button"
                        aria-label="Refresh watchlist"
                    >
                        ↻
                    </button>
                </div>


                <!-- Loading -->
                <div id="loading-state" class="state-card hidden">
                    <div class="spinner"></div>
                    <p>Loading your watchlist...</p>
                </div>


                <!-- Empty -->
                <div id="empty-state" class="state-card hidden">
                    <div class="empty-icon">＋</div>
                    <h3>Your watchlist is empty</h3>
                    <p>Add a ticker above to start tracking a stock.</p>
                </div>


                <!-- Watchlist cards -->
                <div id="watchlist-container" class="watchlist-container"></div>

            </section>

        </main>


        <!-- Footer -->
        <footer class="footer">
            <span>Market Watch</span>
            <span>•</span>
            <span>Powered by Databricks</span>
        </footer>

    </div>


    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
